<!DOCTYPE html>
<html>
<head>
  <title>Create a New Account</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="account-page">

<header class="site-header">
  <div class="brand-logo">
    Window.<span class="orange-text">derivative</span>insight.com
  </div>

  <div class="header-icons">
    <a href="index.html" class="header-icon-link header-icon-img" aria-label="Home">
      <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
    </a>
    <a href="#" class="header-icon-link" onclick="goToDesign(event)">Design</a>
    <a href="cart.html" class="header-icon-link header-icon-img cart-link" aria-label="Cart">
      <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span class="cart-count"></span>
    </a>
    <a href="create-account.html" class="header-icon-link header-icon-img" aria-label="Account">
      <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </a>
  </div>
</header>

  <main class="account-container">
    <h1 id="pageTitle">Create a New Account</h1>

    <div id="registerSection">
      <p class="account-intro" id="accountIntro">
        Please fill in all fields below. Your user name and password will be
        used to sign in next time, and your saved quotes and design information
        will appear in your account.
      </p>

      <form class="account-form" id="registerForm" onsubmit="event.preventDefault(); registerAccount();">
        <label>User Name:</label>
        <input type="text" id="regUsername" required>

        <label>Password:</label>
        <input type="password" id="regPassword" required>

        <label>Confirm Password:</label>
        <input type="password" id="regConfirmPassword" required>

        <label>Full Name:</label>
        <input type="text" id="regFullName" required>

        <label>Company Name:</label>
        <input type="text" id="regCompanyName" required>

        <label>Email:</label>
        <input type="email" id="regEmail" required>

        <label>Phone Number:</label>
        <input type="tel" id="regPhone" required>

        <label>Message:</label>
        <textarea id="regMessage" maxlength="1000"></textarea>

        <button type="submit">Create Account</button>
      </form>

      <p id="registerMessage" class="account-message"></p>
      <p class="account-signin-link">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>

    <div id="accountSection" style="display:none;">
      <div id="accountContent"></div>
    </div>
  </main>

<div id="registerToast" class="register-toast" style="display:none;" role="status" aria-live="polite">
  <p id="registerToastMessage"></p>
</div>

<script src="common.js"></script>
<script src="auth.js"></script>
<script src="create-account.js"></script>
</body>
</html>
